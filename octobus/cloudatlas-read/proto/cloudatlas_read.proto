syntax = "proto3";

package cloudatlas.read.v1;

service CloudAtlasReadService {
  rpc ListIPAssets(ListIPAssetsRequest) returns (ListIPAssetsResponse);
}

message ListIPAssetsRequest {
  string status = 1;
  int32 page = 2;
  int32 size = 3;
}

message IPAsset {
  string id = 1;
  string ip = 2;
  string status = 3;
}

message ListIPAssetsResponse {
  repeated IPAsset items = 1;
  int32 page = 2;
  int32 size = 3;
  int32 total = 4;
}

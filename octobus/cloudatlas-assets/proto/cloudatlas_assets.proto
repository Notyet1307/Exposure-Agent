syntax = "proto3";

package cloudatlas.assets.v1;

service CloudAtlasAssetsService {
  rpc ListIPAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc ListPortServices(ListAssetsRequest) returns (ListAssetsResponse);
}

message ListAssetsRequest {
  int32 page = 1;
  int32 size = 2;
  int32 max_response_bytes = 3;
  int32 timeout_seconds = 4;
}

message ListAssetsResponse {
  int32 page = 1;
  int32 size = 2;
  int32 total = 3;
  string space_id = 4;
  string items_json = 5;
}

syntax = "proto3";

package cloudatlas.dns.v1;

service CloudAtlasDNSService {
  rpc ListDNSRecords(ListDNSRecordsRequest) returns (ListDNSRecordsResponse);
}

message ListDNSRecordsRequest {
  int32 page = 1;
  int32 size = 2;
  int32 max_response_bytes = 3;
  int32 timeout_seconds = 4;
}

message ListDNSRecordsResponse {
  int32 page = 1;
  int32 size = 2;
  int32 total = 3;
  string space_id = 4;
  string items_json = 5;
}

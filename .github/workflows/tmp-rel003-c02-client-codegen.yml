name: Temporary REL-003 C02 client codegen

on:
  push:
    branches:
      - feat/rel003-c02-review-api-v1

permissions:
  contents: write

concurrency:
  group: tmp-rel003-c02-client-codegen
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/rel003-c02-review-api-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3
        with:
          version: 0.11.18

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.12

      - name: Create generation environment
        shell: bash
        run: |
          cp .env.example .env
          {
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "FIRST_SUPERUSER=admin@client-generation.example"
            echo "FIRST_SUPERUSER_PASSWORD=$(openssl rand -hex 32)"
            echo "AGENT_COMPOSE_AUTH_TOKEN=$(openssl rand -hex 32)"
            echo "CLOUDATLAS_CAPSET_TOKEN=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Generate canonical client
        shell: bash
        run: |
          uv sync --all-packages
          bun ci
          bash scripts/generate-client.sh

      - name: Commit generated output
        shell: bash
        run: |
          git add frontend/src/client
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate client for AI draft review API"
          git push origin HEAD:feat/rel003-c02-review-api-v1

name: Test Docker Compose

on:
  push:
    branches:
      - main
  pull_request:
permissions: {}

jobs:
  test-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Detect non-Markdown changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          predicate-quantifier: 'every'
          filters: |
            non_markdown:
              - '**'
              - '!**/*.md'
      - name: Set up Python
        if: steps.changes.outputs.non_markdown == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
      - name: Install uv
        if: steps.changes.outputs.non_markdown == 'true'
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.18"
      - name: Generate deployment-test credentials
        if: steps.changes.outputs.non_markdown == 'true'
        run: |
          {
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "FIRST_SUPERUSER=admin@compose-test.example"
            echo "FIRST_SUPERUSER_PASSWORD=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - name: Assert CI credentials reach every Compose consumer
        if: steps.changes.outputs.non_markdown == 'true'
        run: ./scripts/test-compose-environment-parity.sh
      - if: steps.changes.outputs.non_markdown == 'true'
        run: docker compose -f compose.yml build
      - if: steps.changes.outputs.non_markdown == 'true'
        run: docker compose -f compose.yml down -v --remove-orphans
      - if: steps.changes.outputs.non_markdown == 'true'
        run: docker compose -f compose.yml up -d --wait
      - name: Test liveness and readiness on the loopback ingress upstream
        if: steps.changes.outputs.non_markdown == 'true'
        run: |
          curl --fail http://127.0.0.1:8080/health/live
          curl --fail http://127.0.0.1:8080/health/ready
      - name: Test frontend is up on the loopback ingress upstream
        if: steps.changes.outputs.non_markdown == 'true'
        run: curl --fail http://127.0.0.1:8080/login
      - name: Test trusted ingress client address reaches the audit stream
        if: steps.changes.outputs.non_markdown == 'true'
        run: |
          audit_ip="203.0.113.42"
          access_token="$(
            curl --fail --silent --show-error \
              --data-urlencode "username=${FIRST_SUPERUSER}" \
              --data-urlencode "password=${FIRST_SUPERUSER_PASSWORD}" \
              http://127.0.0.1:8080/api/v1/login/access-token \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])'
          )"
          audit_email="audit-client-ip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          created_user="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${access_token}" \
              -H "Content-Type: application/json" \
              -H "X-Real-IP: ${audit_ip}" \
              --data "{\"email\":\"${audit_email}\",\"password\":\"compose-audit-password\"}" \
              http://127.0.0.1:8080/api/v1/users/
          )"
          target_id="$(
            printf '%s' "${created_user}" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])'
          )"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${access_token}" \
            http://127.0.0.1:8080/api/v1/audit-events/ \
            | AUDIT_TARGET_ID="${target_id}" AUDIT_EXPECTED_IP="${audit_ip}" python3 -c '
          import json
          import os
          import sys

          events = json.load(sys.stdin)["data"]
          event = next(
              item
              for item in events
              if item["target_id"] == os.environ["AUDIT_TARGET_ID"]
              and item["action"] == "user.created"
          )
          assert event["ip_address"] == os.environ["AUDIT_EXPECTED_IP"], event
          '
      - if: steps.changes.outputs.non_markdown == 'true'
        run: docker compose -f compose.yml down -v --remove-orphans
      - name: Test the deterministic CloudAtlas OctoBus Connect fixture
        if: steps.changes.outputs.non_markdown == 'true'
        run: ./scripts/test-cloudatlas-fixture.sh
      - name: Test GovernanceRun recovery through the real Compose boundaries
        if: steps.changes.outputs.non_markdown == 'true'
        run: ./scripts/test-governance-run.sh

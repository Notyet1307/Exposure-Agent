name: Temporary REL-003 C03 UI wiring

on:
  push:
    branches:
      - feat/rel003-c03-review-ui-v1

permissions:
  contents: write

concurrency:
  group: tmp-rel003-c03-wire-ui
  cancel-in-progress: true

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/rel003-c03-review-ui-v1
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.12

      - name: Wire review component into report dialog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/components/GovernanceReports.tsx")
          text = path.read_text(encoding="utf-8")
          import_marker = (
              'import { Alert, AlertDescription, AlertTitle } '
              'from "@/components/ui/alert"\n'
          )
          review_import = (
              'import AiGovernanceDraftReview '
              'from "@/components/AiGovernanceDraftReview"\n'
          )
          if review_import not in text:
              if import_marker not in text:
                  raise SystemExit("alert import marker not found")
              text = text.replace(import_marker, review_import + import_marker, 1)

          start = (
              '      {latestDraft && (\n'
              '        <div className="rounded-md border p-3 text-sm" '
              'role="status">\n'
          )
          start_replacement = (
              '      {latestDraft && (\n'
              '        <>\n'
              '          <div className="rounded-md border p-3 text-sm" '
              'role="status">\n'
          )
          if start not in text:
              raise SystemExit("latest draft block start not found")
          text = text.replace(start, start_replacement, 1)

          end = '        </div>\n      )}\n    </ReportSection>\n'
          end_replacement = (
              '          </div>\n'
              '          <AiGovernanceDraftReview\n'
              '            draft={latestDraft}\n'
              '            projectId={projectId}\n'
              '            reportId={detail.id}\n'
              '          />\n'
              '        </>\n'
              '      )}\n'
              '    </ReportSection>\n'
          )
          if end not in text:
              raise SystemExit("latest draft block end not found")
          text = text.replace(end, end_replacement, 1)
          path.write_text(text, encoding="utf-8")

          component_path = Path(
              "frontend/src/components/AiGovernanceDraftReview.tsx"
          )
          component = component_path.read_text(encoding="utf-8")
          region_marker = (
              '<div className="space-y-4 rounded-md border p-3" '
              'aria-label="AI draft review">'
          )
          if 'role="region"' not in component:
              if region_marker not in component:
                  raise SystemExit("review region marker not found")
              component = component.replace(
                  region_marker,
                  '<div className="space-y-4 rounded-md border p-3" '
                  'aria-label="AI draft review" role="region">',
                  1,
              )
          component_path.write_text(component, encoding="utf-8")
          PY
          bun ci
          bun run --filter exposure-agent-frontend lint

      - name: Commit UI wiring
        shell: bash
        run: |
          git add \
            frontend/src/components/GovernanceReports.tsx \
            frontend/src/components/AiGovernanceDraftReview.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: wire terminal draft review into reports"
          git push origin HEAD:feat/rel003-c03-review-ui-v1

name: Temporary REL-003 C1 contract fix

on:
  push:
    branches:
      - feat/rel003-c1-generation-v1

permissions:
  contents: write

concurrency:
  group: tmp-rel003-c1-contract-fix
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/rel003-c1-generation-v1
          fetch-depth: 0

      - name: Update superseded boundary contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          agent_compose_test = Path("backend/tests/integrations/test_agent_compose.py")
          text = agent_compose_test.read_text(encoding="utf-8")
          old = '''    run_request = calls[1]["json"]["run"]
              assert run_request["agentName"] == "ai-governance-draft"
              assert run_request["command"] == "/usr/bin/true"
              assert run_request["env"] == []
          '''
          new = '''    run_request = calls[1]["json"]["run"]
              assert run_request["agentName"] == "ai-governance-draft"
              assert run_request["command"] == (
                  "/app/.venv/bin/python -m app.ai_draft_runner"
              )
              assert run_request["env"] == [
                  {
                      "name": "AI_DRAFT_ID",
                      "value": "00000000-0000-0000-0000-000000000001",
                      "secret": False,
                  },
                  {
                      "name": "AI_DRAFT_RUN_ID",
                      "value": expected_id,
                      "secret": False,
                  },
              ]
          '''
          if old not in text:
              raise SystemExit("agent-compose assertion block not found")
          agent_compose_test.write_text(text.replace(old, new, 1), encoding="utf-8")

          boundary_test = Path(
              "backend/tests/integrations/test_model_qualification_boundary.py"
          )
          text = boundary_test.read_text(encoding="utf-8")
          old = '''def test_draft_session_agent_has_no_application_or_model_credentials() -> None:
              compose = (REPOSITORY_ROOT / "agent-compose.yml").read_text()
              draft_agent = compose.split("  ai-governance-draft:\\n", maxsplit=1)[1]
          
              assert "    provider: pi\\n" in draft_agent
              assert "    model: customer/${MODEL_IDENTITY}\\n" in draft_agent
              assert "    env:\\n" not in draft_agent
              for forbidden in (
                  "POSTGRES_",
                  "SECRET_KEY",
                  "FIRST_SUPERUSER",
                  "LLM_",
                  "MODEL_API_",
                  "AI_DRAFT_",
              ):
                  assert forbidden not in draft_agent
          
              integration = (
                  REPOSITORY_ROOT / "backend/app/integrations/agent_compose.py"
              ).read_text()
              assert 'command="/usr/bin/true"' in integration
          '''
          new = '''def test_draft_session_agent_gives_only_the_parent_runner_required_credentials() -> None:
              compose = (REPOSITORY_ROOT / "agent-compose.yml").read_text()
              draft_agent = compose.split("  ai-governance-draft:\\n", maxsplit=1)[1]
          
              assert "    provider: pi\\n" in draft_agent
              assert "    model: customer/${MODEL_IDENTITY}\\n" in draft_agent
              assert "    env:\\n" in draft_agent
              for required in (
                  "POSTGRES_SERVER",
                  "POSTGRES_PORT",
                  "POSTGRES_DB",
                  "POSTGRES_USER",
                  "POSTGRES_PASSWORD",
                  "SECRET_KEY",
                  "FIRST_SUPERUSER",
                  "FIRST_SUPERUSER_PASSWORD",
                  "MODEL_API_ENDPOINT",
                  "MODEL_API_PROTOCOL",
                  "MODEL_API_KEY",
                  "MODEL_IDENTITY",
                  "MODEL_CONFIG_REVISION",
                  "AGENT_COMPOSE_RUNTIME_VERSION",
                  "AI_GOVERNANCE_DRAFT_TIMEOUT_SECONDS",
              ):
                  assert f"      {required}:" in draft_agent
              assert "      LLM_API_KEY:" not in draft_agent
              assert "      AI_DRAFT_ID:" not in draft_agent
              assert "      AI_DRAFT_RUN_ID:" not in draft_agent
              assert draft_agent.count("        secret: true\\n") >= 4
          
              integration = (
                  REPOSITORY_ROOT / "backend/app/integrations/agent_compose.py"
              ).read_text()
              assert (
                  'command="/app/.venv/bin/python -m app.ai_draft_runner"'
                  in integration
              )
              assert "/usr/bin/true" not in integration
          '''
          if old not in text:
              raise SystemExit("draft-agent boundary block not found")
          text = text.replace(old, new, 1)
          old_timeout = '        "MODEL_QUALIFICATION_TIMEOUT_SECONDS": "17",\n'
          new_timeout = (
              old_timeout
              + '        "AI_GOVERNANCE_DRAFT_TIMEOUT_SECONDS": "19",\n'
          )
          if old_timeout not in text:
              raise SystemExit("qualification timeout fixture not found")
          boundary_test.write_text(
              text.replace(old_timeout, new_timeout, 1),
              encoding="utf-8",
          )
          PY

      - name: Commit contract updates
        shell: bash
        run: |
          git add \
            backend/tests/integrations/test_agent_compose.py \
            backend/tests/integrations/test_model_qualification_boundary.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align draft generation boundary contracts"
          git push origin HEAD:feat/rel003-c1-generation-v1

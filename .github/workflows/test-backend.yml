name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
permissions: {}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Detect non-Markdown changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          predicate-quantifier: 'every'
          filters: |
            non_markdown:
              - '**'
              - '!**/*.md'
      - name: Create runtime environment
        if: steps.changes.outputs.non_markdown == 'true'
        run: |
          cp .env.example .env
          {
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "FIRST_SUPERUSER=admin@backend-test.example"
            echo "FIRST_SUPERUSER_PASSWORD=$(openssl rand -hex 32)"
            echo "AGENT_COMPOSE_AUTH_TOKEN=$(openssl rand -hex 32)"
            echo "CLOUDATLAS_CAPSET_TOKEN=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - name: Set up Python
        if: steps.changes.outputs.non_markdown == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
      - name: Install uv
        if: steps.changes.outputs.non_markdown == 'true'
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.18"
      - if: steps.changes.outputs.non_markdown == 'true'
        run: docker compose down -v --remove-orphans
      - if: steps.changes.outputs.non_markdown == 'true'
        run: docker compose up -d db
      - name: Migrate DB
        if: steps.changes.outputs.non_markdown == 'true'
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        if: steps.changes.outputs.non_markdown == 'true'
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - if: steps.changes.outputs.non_markdown == 'true'
        run: docker compose down -v --remove-orphans
      - name: Store coverage files
        if: steps.changes.outputs.non_markdown == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        if: steps.changes.outputs.non_markdown == 'true'
        run: uv run coverage report --fail-under=90
        working-directory: backend

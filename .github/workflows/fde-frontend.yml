name: FDE frontend verification

on:
  pull_request:

permissions: {}

jobs:
  fde-frontend:
    name: FDE frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Select CI source
        id: source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          source_sha="$BASE_SHA"
          changed=$(git -C candidate diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/fde-frontend.yml scripts/fde-frontend-ci.mts \
            scripts/fde-frontend-ci.test.mts frontend/playwright.config.ts)
          if [ -n "$changed" ]; then
            source_sha="$HEAD_SHA"
            echo '::notice::CI source changed: ordinary CI self-check, not an approved-baseline FDE Gate.'
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout CI source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: approved-ci
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        run: bun ci
        working-directory: candidate
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: candidate/frontend
      - name: Project checks
        env:
          FDE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          FDE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FDE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: env -u NODE_OPTIONS node --experimental-strip-types approved-ci/scripts/fde-frontend-ci.mts checks candidate "$RUNNER_TEMP/fde-frontend-result.json"
      - name: Project report
        if: always()
        env:
          FDE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          FDE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FDE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: env -u NODE_OPTIONS node --experimental-strip-types approved-ci/scripts/fde-frontend-ci.mts report candidate "$RUNNER_TEMP/fde-frontend-result.json"

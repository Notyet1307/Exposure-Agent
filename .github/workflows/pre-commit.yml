name: Lint and Type Check

on:
  pull_request:

permissions: {}

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check repository context hygiene
        run: python3 scripts/check-context-hygiene.py
      - name: Detect non-Markdown changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          predicate-quantifier: 'every'
          filters: |
            non_markdown:
              - '**'
              - '!**/*.md'
      - name: Create runtime environment
        if: steps.changes.outputs.non_markdown == 'true'
        run: |
          cp .env.example .env
          {
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "FIRST_SUPERUSER=admin@client-generation.example"
            echo "FIRST_SUPERUSER_PASSWORD=$(openssl rand -hex 32)"
            echo "AGENT_COMPOSE_AUTH_TOKEN=$(openssl rand -hex 32)"
            echo "CLOUDATLAS_CAPSET_TOKEN=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
      - name: Set up Python
        if: steps.changes.outputs.non_markdown == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        if: steps.changes.outputs.non_markdown == 'true'
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.11.18"
      - name: Set up Bun
        if: steps.changes.outputs.non_markdown == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install backend dependencies
        if: steps.changes.outputs.non_markdown == 'true'
        run: uv sync --all-packages
      - name: Install frontend dependencies
        if: steps.changes.outputs.non_markdown == 'true'
        run: bun ci
      - name: Generate frontend client and verify no drift
        if: steps.changes.outputs.non_markdown == 'true'
        run: |
          bash scripts/generate-client.sh
          git diff --exit-code
      - name: Lint and type check backend
        if: steps.changes.outputs.non_markdown == 'true'
        run: uv run bash scripts/lint.sh
        working-directory: backend
      - name: Build frontend
        if: steps.changes.outputs.non_markdown == 'true'
        run: bun run build
        working-directory: frontend

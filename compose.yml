services:
  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  governance-runner-image:
    image: '${DOCKER_IMAGE_RUNNER?Variable not set}:${RUNNER_BUILD_VERSION?Variable not set}'
    build:
      context: .
      dockerfile: backend/Dockerfile.runner
      args:
        RUNNER_BUILD_VERSION: ${RUNNER_BUILD_VERSION?Variable not set}
    command: ["true"]

  agent-compose:
    # v2608.4.0 multi-architecture manifest with Pi support; upstream
    # revision 5df1acb0cda4159f7106f263e358c8a84026a142.
    image: 'chaitin/agent-compose@${AGENT_COMPOSE_RUNTIME_VERSION:?Variable not set or empty}'
    restart: always
    environment:
      AGENT_COMPOSE_AUTH_TOKEN: ${AGENT_COMPOSE_AUTH_TOKEN:?Variable not set or empty}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-compose-data:/data
      - type: bind
        source: ${ARTIFACT_HOST_PATH:?Variable not set or empty}
        target: ${ARTIFACT_HOST_PATH:?Variable not set or empty}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "agent-compose --host http://127.0.0.1:7410 auth login --token \"$${AGENT_COMPOSE_AUTH_TOKEN}\" >/dev/null && agent-compose --host http://127.0.0.1:7410 status --json >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  agent-compose-project-init:
    image: 'chaitin/agent-compose@${AGENT_COMPOSE_RUNTIME_VERSION:?Variable not set or empty}'
    depends_on:
      agent-compose:
        condition: service_healthy
      governance-runner-image:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        sh /usr/local/bin/render-exposure-agent-config
        /config/agent-compose.template.yml /config/agent-compose.yml &&
        agent-compose --host http://agent-compose:7410 auth login
        --token "$${AGENT_COMPOSE_AUTH_TOKEN}" >/dev/null &&
        exec agent-compose --host http://agent-compose:7410
        --file /config/agent-compose.yml up --json
    env_file:
      - .env
    environment:
      AGENT_COMPOSE_AUTH_TOKEN: ${AGENT_COMPOSE_AUTH_TOKEN:?Variable not set or empty}
      AGENT_COMPOSE_RUNTIME_VERSION: ${AGENT_COMPOSE_RUNTIME_VERSION:?Variable not set or empty}
      ARTIFACT_HOST_PATH: ${ARTIFACT_HOST_PATH:?Variable not set or empty}
      CLOUDATLAS_CAPSET_TOKEN: ${CLOUDATLAS_CAPSET_TOKEN:?Variable not set or empty}
      DOCKER_IMAGE_RUNNER: ${DOCKER_IMAGE_RUNNER?Variable not set}
      ENVIRONMENT: ${ENVIRONMENT?Variable not set}
      PROJECT_NAME: ${PROJECT_NAME?Variable not set}
      RUNNER_BUILD_VERSION: ${RUNNER_BUILD_VERSION?Variable not set}
      MODEL_API_ENDPOINT: ${MODEL_API_ENDPOINT:-http://127.0.0.1:9/v1}
      MODEL_API_PROTOCOL: ${MODEL_API_PROTOCOL:-chat_completions}
      MODEL_API_KEY: ${MODEL_API_KEY-}
      MODEL_IDENTITY: ${MODEL_IDENTITY:-unconfigured}
      MODEL_CONFIG_REVISION: ${MODEL_CONFIG_REVISION:-v1}
      MODEL_QUALIFICATION_TIMEOUT_SECONDS: ${MODEL_QUALIFICATION_TIMEOUT_SECONDS:-120}
      SECRET_KEY: ${SECRET_KEY:?Variable not set or empty}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}
      POSTGRES_DB: ${POSTGRES_DB?Variable not set}
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
    volumes:
      - ./agent-compose.yml:/config/agent-compose.template.yml:ro
      - ./scripts/render-agent-compose-config.sh:/usr/local/bin/render-exposure-agent-config:ro

  octobus:
    image: '${DOCKER_IMAGE_OCTOBUS?Variable not set}:${TAG-latest}'
    restart: always
    build:
      context: .
      dockerfile: octobus/Dockerfile
    command: ["serve", "--data-dir", "/var/lib/octobus", "--addr", "0.0.0.0:9000"]
    volumes:
      - octobus-data:/var/lib/octobus
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/admin/v1/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  octobus-package-init:
    image: '${DOCKER_IMAGE_OCTOBUS?Variable not set}:${TAG-latest}'
    build:
      context: .
      dockerfile: octobus/Dockerfile
    depends_on:
      octobus:
        condition: service_healthy
        restart: true
    command:
      [
        "--addr",
        "octobus:9000",
        "service",
        "import",
        "cloudatlas-read",
        "/opt/exposure-agent/service-packages/cloudatlas-read",
      ]

  prestart:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Variable not set or empty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
      octobus:
        condition: service_healthy
        restart: true
      octobus-package-init:
        condition: service_completed_successfully
      agent-compose-project-init:
        condition: service_completed_successfully
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Variable not set or empty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}
      ARTIFACT_ROOT: /app/artifacts
      OCTOBUS_URL: ${OCTOBUS_URL:-http://octobus:9000}
      CLOUDATLAS_CAPSET_TOKEN: ${CLOUDATLAS_CAPSET_TOKEN:?Variable not set or empty}
      AGENT_COMPOSE_URL: http://agent-compose:7410
      AGENT_COMPOSE_AUTH_TOKEN: ${AGENT_COMPOSE_AUTH_TOKEN:?Variable not set or empty}
      AGENT_COMPOSE_RUNTIME_VERSION: ${AGENT_COMPOSE_RUNTIME_VERSION:?Variable not set or empty}
      RUNNER_BUILD_VERSION: ${RUNNER_BUILD_VERSION:?Variable not set or empty}
      MODEL_API_ENDPOINT: ${MODEL_API_ENDPOINT:-http://127.0.0.1:9/v1}
      MODEL_API_PROTOCOL: ${MODEL_API_PROTOCOL:-chat_completions}
      MODEL_API_KEY: ${MODEL_API_KEY-}
      MODEL_IDENTITY: ${MODEL_IDENTITY:-unconfigured}
      MODEL_CONFIG_REVISION: ${MODEL_CONFIG_REVISION:-v1}
      MODEL_QUALIFICATION_TIMEOUT_SECONDS: ${MODEL_QUALIFICATION_TIMEOUT_SECONDS:-120}
    volumes:
      - type: bind
        source: ${ARTIFACT_HOST_PATH:?Variable not set or empty}
        target: /app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: .
      dockerfile: backend/Dockerfile

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8080}:80"

volumes:
  app-db-data:
  octobus-data:
  agent-compose-data:

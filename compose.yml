services:
  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  octobus:
    image: '${DOCKER_IMAGE_OCTOBUS?Variable not set}:${TAG-latest}'
    restart: always
    build:
      context: .
      dockerfile: octobus/Dockerfile
    command: ["serve", "--data-dir", "/var/lib/octobus", "--addr", "0.0.0.0:9000"]
    volumes:
      - octobus-data:/var/lib/octobus
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/admin/v1/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  octobus-package-init:
    image: '${DOCKER_IMAGE_OCTOBUS?Variable not set}:${TAG-latest}'
    build:
      context: .
      dockerfile: octobus/Dockerfile
    depends_on:
      octobus:
        condition: service_healthy
        restart: true
    command:
      [
        "--addr",
        "octobus:9000",
        "service",
        "import",
        "cloudatlas-read",
        "/opt/exposure-agent/service-packages/cloudatlas-read",
      ]

  prestart:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Variable not set or empty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
      octobus:
        condition: service_healthy
        restart: true
      octobus-package-init:
        condition: service_completed_successfully
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Variable not set or empty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}
      ARTIFACT_ROOT: /app/artifacts
      OCTOBUS_URL: ${OCTOBUS_URL:-http://octobus:9000}
    volumes:
      - app-artifact-data:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: .
      dockerfile: backend/Dockerfile

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8080}:80"

volumes:
  app-db-data:
  app-artifact-data:
  octobus-data:

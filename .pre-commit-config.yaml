# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
        exclude: |
            (?x)^(
                frontend/src/client/.*
            )$
      - id: trailing-whitespace
        exclude: ^frontend/src/client/.*
  - repo: https://github.com/crate-ci/typos
    rev: bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # frozen: v1.48.0
    hooks:
      - id: typos
        args: [--force-exclude]
  - repo: local
    hooks:
      - id: context-hygiene
        name: context hygiene
        entry: bash scripts/with-tool-path.sh python3 scripts/check-context-hygiene.py
        language: system
        pass_filenames: false
        always_run: true

      - id: local-biome-check
        name: biome check
        entry: bash scripts/with-tool-path.sh bun run lint
        language: system
        pass_filenames: false
        types: [text]
        files: ^frontend/

      - id: local-ruff-check
        name: ruff check
        entry: bash scripts/with-tool-path.sh uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: system
        types: [python]

      - id: local-ruff-format
        name: ruff format
        entry: bash scripts/with-tool-path.sh uv run ruff format --force-exclude --exit-non-zero-on-format
        require_serial: true
        language: system
        types: [python]

      - id: local-mypy
        name: mypy check
        entry: bash scripts/with-tool-path.sh uv run mypy backend/app
        require_serial: true
        language: system
        pass_filenames: false

      - id: local-ty
        name: ty check
        entry: bash scripts/with-tool-path.sh uv run ty check backend/app
        require_serial: true
        language: system
        pass_filenames: false

      - id: generate-frontend-sdk
        name: Generate Frontend SDK
        entry: bash scripts/with-tool-path.sh bash ./scripts/generate-client.sh
        pass_filenames: false
        language: system
        files: ^backend/.*$|^scripts/generate-client\.sh$

      - id: zizmor
        name: zizmor
        language: system
        entry: bash scripts/with-tool-path.sh uv run zizmor .
        files: ^\.github\/workflows\/
        require_serial: true
        pass_filenames: false

name: exposure-agent-governance

agents:
  governance-runner:
    provider: codex
    image: ${DOCKER_IMAGE_RUNNER}:${RUNNER_BUILD_VERSION}
    driver:
      docker: {}
    env:
      PROJECT_NAME: ${PROJECT_NAME}
      ENVIRONMENT: ${ENVIRONMENT}
      SECRET_KEY:
        value: ${SECRET_KEY}
        secret: true
      FIRST_SUPERUSER: ${FIRST_SUPERUSER}
      FIRST_SUPERUSER_PASSWORD:
        value: ${FIRST_SUPERUSER_PASSWORD}
        secret: true
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD:
        value: ${POSTGRES_PASSWORD}
        secret: true
      ARTIFACT_ROOT: /app/artifacts
      OCTOBUS_URL: http://octobus:9000
      CLOUDATLAS_CAPSET_TOKEN:
        value: ${CLOUDATLAS_CAPSET_TOKEN}
        secret: true
      RUNNER_BUILD_VERSION: ${RUNNER_BUILD_VERSION}
    volumes:
      - type: bind
        source: ${ARTIFACT_HOST_PATH}
        target: /app/artifacts

  model-qualifier:
    provider: pi
    model: customer/${MODEL_IDENTITY}
    image: ${DOCKER_IMAGE_RUNNER}:${RUNNER_BUILD_VERSION}
    driver:
      docker: {}
    env:
      PROJECT_NAME: model-qualification
      POSTGRES_SERVER: unused
      POSTGRES_USER: unused
      FIRST_SUPERUSER: fixture@example.com
      FIRST_SUPERUSER_PASSWORD: unused
      LLM_API_ENDPOINT: ${MODEL_API_ENDPOINT}
      LLM_API_PROTOCOL: ${MODEL_API_PROTOCOL}
      LLM_API_KEY:
        value: ${MODEL_API_KEY}
        secret: true
      MODEL_IDENTITY: ${MODEL_IDENTITY}
      MODEL_CONFIG_REVISION: ${MODEL_CONFIG_REVISION}
      AGENT_COMPOSE_RUNTIME_VERSION: ${AGENT_COMPOSE_RUNTIME_VERSION}
      MODEL_QUALIFICATION_TIMEOUT_SECONDS: ${MODEL_QUALIFICATION_TIMEOUT_SECONDS}

  ai-governance-draft:
    provider: pi
    model: customer/${MODEL_IDENTITY}
    image: ${DOCKER_IMAGE_RUNNER}:${RUNNER_BUILD_VERSION}
    driver:
      docker: {}

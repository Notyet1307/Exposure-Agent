name: exposure-agent-governance

agents:
  governance-runner:
    provider: codex
    image: ${DOCKER_IMAGE_RUNNER}:${RUNNER_BUILD_VERSION}
    driver:
      docker: {}
    env:
      PROJECT_NAME: ${PROJECT_NAME}
      ENVIRONMENT: ${ENVIRONMENT}
      SECRET_KEY:
        value: ${SECRET_KEY}
        secret: true
      FIRST_SUPERUSER: ${FIRST_SUPERUSER}
      FIRST_SUPERUSER_PASSWORD:
        value: ${FIRST_SUPERUSER_PASSWORD}
        secret: true
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD:
        value: ${POSTGRES_PASSWORD}
        secret: true
      ARTIFACT_ROOT: /app/artifacts
      OCTOBUS_URL: http://octobus:9000
      CLOUDATLAS_CAPSET_TOKEN:
        value: ${CLOUDATLAS_CAPSET_TOKEN}
        secret: true
      RUNNER_BUILD_VERSION: ${RUNNER_BUILD_VERSION}
    volumes:
      - type: bind
        source: ${ARTIFACT_HOST_PATH}
        target: /app/artifacts

  model-qualifier:
    provider: pi
    model: customer/${MODEL_IDENTITY}
    system_prompt: |
      Process only the supplied fixed synthetic fixture. Do not use tools or
      perform side effects. Return only the requested JSON object.
    image: ${DOCKER_IMAGE_RUNNER}:${RUNNER_BUILD_VERSION}
    driver:
      docker: {}
    env:
      LLM_API_ENDPOINT: ${MODEL_API_ENDPOINT}
      LLM_API_PROTOCOL: ${MODEL_API_PROTOCOL}
      LLM_API_KEY:
        value: ${MODEL_API_KEY}
        secret: true

name: exposure-agent-governance

agents:
  governance-runner:
    provider: codex
    image: ${DOCKER_IMAGE_RUNNER}:${RUNNER_BUILD_VERSION}
    driver:
      docker: {}
    env:
      PROJECT_NAME: ${PROJECT_NAME}
      ENVIRONMENT: ${ENVIRONMENT}
      SECRET_KEY:
        value: ${SECRET_KEY}
        secret: true
      FIRST_SUPERUSER: ${FIRST_SUPERUSER}
      FIRST_SUPERUSER_PASSWORD:
        value: ${FIRST_SUPERUSER_PASSWORD}
        secret: true
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD:
        value: ${POSTGRES_PASSWORD}
        secret: true
      ARTIFACT_ROOT: /app/artifacts
      NETFLOW_MAX_BYTES: ${NETFLOW_MAX_BYTES}
      OCTOBUS_URL: http://octobus:9000
      CLOUDATLAS_CAPSET_TOKEN:
        value: ${CLOUDATLAS_CAPSET_TOKEN}
        secret: true
      RUNNER_BUILD_VERSION: ${RUNNER_BUILD_VERSION}
    volumes:
      - type: bind
        source: ${ARTIFACT_HOST_PATH}
        target: /app/artifacts

  model-qualifier:
    provider: pi
    model: customer/${MODEL_IDENTITY}
    image: ${DOCKER_IMAGE_RUNNER}:${RUNNER_BUILD_VERSION}
    driver:
      docker: {}
    env:
      PROJECT_NAME: model-qualification
      POSTGRES_SERVER: unused
      POSTGRES_USER: unused
      FIRST_SUPERUSER: fixture@example.com
      FIRST_SUPERUSER_PASSWORD: unused
      NETFLOW_MAX_BYTES: ${NETFLOW_MAX_BYTES}
      LLM_API_ENDPOINT: ${MODEL_API_ENDPOINT}
      LLM_API_PROTOCOL: ${MODEL_API_PROTOCOL}
      MODEL_QUALIFICATION_ALLOW_BAIZHI_TEST: "${MODEL_QUALIFICATION_ALLOW_BAIZHI_TEST}"
      LLM_API_KEY:
        value: ${MODEL_API_KEY}
        secret: true
      MODEL_IDENTITY: ${MODEL_IDENTITY}
      MODEL_CONFIG_REVISION: ${MODEL_CONFIG_REVISION}
      AGENT_COMPOSE_RUNTIME_VERSION: ${AGENT_COMPOSE_RUNTIME_VERSION}
      MODEL_QUALIFICATION_TIMEOUT_SECONDS: ${MODEL_QUALIFICATION_TIMEOUT_SECONDS}

  ai-governance-draft:
    provider: pi
    model: customer/${MODEL_IDENTITY}
    image: ${DOCKER_IMAGE_RUNNER}:${RUNNER_BUILD_VERSION}
    driver:
      docker: {}

  ai-investigation:
    provider: pi
    model: customer/${MODEL_IDENTITY}
    image: ${DOCKER_IMAGE_RUNNER}:${RUNNER_BUILD_VERSION}
    driver:
      docker: {}
    env:
      PROJECT_NAME: ${PROJECT_NAME}
      ENVIRONMENT: ${ENVIRONMENT}
      SECRET_KEY:
        value: ${SECRET_KEY}
        secret: true
      FIRST_SUPERUSER: ${FIRST_SUPERUSER}
      FIRST_SUPERUSER_PASSWORD:
        value: ${FIRST_SUPERUSER_PASSWORD}
        secret: true
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD:
        value: ${POSTGRES_PASSWORD}
        secret: true
      NETFLOW_MAX_BYTES: ${NETFLOW_MAX_BYTES}
      OCTOBUS_URL: http://octobus:9000
      CLOUDATLAS_CAPSET_TOKEN:
        value: ${CLOUDATLAS_CAPSET_TOKEN}
        secret: true
      RUNNER_BUILD_VERSION: ${RUNNER_BUILD_VERSION}
      AGENT_COMPOSE_RUNTIME_VERSION: ${AGENT_COMPOSE_RUNTIME_VERSION}
      MODEL_API_ENDPOINT: ${MODEL_API_ENDPOINT}
      MODEL_API_PROTOCOL: ${MODEL_API_PROTOCOL}
      MODEL_API_KEY:
        value: ${MODEL_API_KEY}
        secret: true
      MODEL_IDENTITY: ${MODEL_IDENTITY}
      MODEL_CONFIG_REVISION: ${MODEL_CONFIG_REVISION}
      AI_INVESTIGATION_ALLOW_BAIZHI_TEST: "${AI_INVESTIGATION_ALLOW_BAIZHI_TEST}"
      AI_INVESTIGATION_SYNTHETIC_MANIFEST: '${AI_INVESTIGATION_SYNTHETIC_MANIFEST}'
      AI_INVESTIGATION_TIMEOUT_SECONDS: "${AI_INVESTIGATION_TIMEOUT_SECONDS}"
      AI_INVESTIGATION_MAX_TOOL_CALLS: "${AI_INVESTIGATION_MAX_TOOL_CALLS}"
      AI_INVESTIGATION_MAX_MATERIAL_BYTES: "${AI_INVESTIGATION_MAX_MATERIAL_BYTES}"
      AI_INVESTIGATION_MAX_OUTPUT_BYTES: "${AI_INVESTIGATION_MAX_OUTPUT_BYTES}"

  ai-analysis-report:
    provider: pi
    model: customer/${MODEL_IDENTITY}
    image: ${DOCKER_IMAGE_RUNNER}:${RUNNER_BUILD_VERSION}
    driver:
      docker: {}
    env:
      PROJECT_NAME: ${PROJECT_NAME}
      ENVIRONMENT: ${ENVIRONMENT}
      SECRET_KEY:
        value: ${SECRET_KEY}
        secret: true
      FIRST_SUPERUSER: ${FIRST_SUPERUSER}
      FIRST_SUPERUSER_PASSWORD:
        value: ${FIRST_SUPERUSER_PASSWORD}
        secret: true
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD:
        value: ${POSTGRES_PASSWORD}
        secret: true
      NETFLOW_MAX_BYTES: ${NETFLOW_MAX_BYTES}
      RUNNER_BUILD_VERSION: ${RUNNER_BUILD_VERSION}
      AGENT_COMPOSE_RUNTIME_VERSION: ${AGENT_COMPOSE_RUNTIME_VERSION}
      MODEL_API_ENDPOINT: ${MODEL_API_ENDPOINT}
      MODEL_API_PROTOCOL: ${MODEL_API_PROTOCOL}
      MODEL_API_KEY:
        value: ${MODEL_API_KEY}
        secret: true
      MODEL_IDENTITY: ${MODEL_IDENTITY}
      MODEL_CONFIG_REVISION: ${MODEL_CONFIG_REVISION}
      AI_ANALYSIS_REPORT_ALLOW_BAIZHI_TEST: "${AI_ANALYSIS_REPORT_ALLOW_BAIZHI_TEST}"
      AI_ANALYSIS_REPORT_SYNTHETIC_MANIFEST: '${AI_ANALYSIS_REPORT_SYNTHETIC_MANIFEST}'
      AI_ANALYSIS_REPORT_TIMEOUT_SECONDS: "${AI_ANALYSIS_REPORT_TIMEOUT_SECONDS}"
      AI_ANALYSIS_REPORT_MAX_TOOL_CALLS: "${AI_ANALYSIS_REPORT_MAX_TOOL_CALLS}"
      AI_ANALYSIS_REPORT_MAX_MATERIAL_BYTES: "${AI_ANALYSIS_REPORT_MAX_MATERIAL_BYTES}"
      AI_ANALYSIS_REPORT_MAX_OUTPUT_BYTES: "${AI_ANALYSIS_REPORT_MAX_OUTPUT_BYTES}"

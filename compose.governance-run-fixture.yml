services:
  db:
    ports: !reset []

  backend:
    ports: !reset []
    depends_on:
      cloudatlas-fixture-init:
        condition: service_completed_successfully
      model-qualification-fixture:
        condition: service_healthy
    environment:
      AGENT_COMPOSE_URL: http://cloudatlas-fixture:18080

  agent-compose-project-init:
    volumes:
      - type: bind
        source: ${AGENT_COMPOSE_CONFIG_PATH:?Variable not set or empty}
        target: /config/agent-compose.template.yml
        read_only: true
      - type: bind
        source: ${ARTIFACT_HOST_PATH:?Variable not set or empty}
        target: /cleanup

  frontend:
    ports: !reset []

  model-qualification-fixture:
    image: '${DOCKER_IMAGE_RUNNER?Variable not set}:${RUNNER_BUILD_VERSION?Variable not set}'
    depends_on:
      governance-runner-image:
        condition: service_completed_successfully
    command:
      - /app/.venv/bin/python
      - /fixture/fake_provider.py
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:?Variable not set or empty}
    volumes:
      - ./tests/model_qualification_fixture:/fixture:ro
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 2s
      timeout: 2s
      retries: 15

  cloudatlas-fixture:
    build:
      context: .
      dockerfile: tests/cloudatlas_fixture/Dockerfile.upstream
    environment:
      FIXTURE_CLOUDATLAS_TOKEN: ${FIXTURE_CLOUDATLAS_TOKEN:?Variable not set or empty}
      FIXTURE_AGENT_COMPOSE_URL: http://agent-compose:7410

  cloudatlas-fixture-init:
    image: '${DOCKER_IMAGE_OCTOBUS?Variable not set}:${TAG-latest}'
    build:
      context: .
      dockerfile: octobus/Dockerfile
    entrypoint: ["/bin/sh", "/fixture-init.sh"]
    depends_on:
      cloudatlas-fixture:
        condition: service_started
      octobus-package-init:
        condition: service_completed_successfully
    environment:
      FIXTURE_CLOUDATLAS_TOKEN: ${FIXTURE_CLOUDATLAS_TOKEN:?Variable not set or empty}
      FIXTURE_CAPSET_TOKEN: ${CLOUDATLAS_CAPSET_TOKEN:?Variable not set or empty}
    volumes:
      - ./tests/governance_run/init_octobus.sh:/fixture-init.sh:ro
